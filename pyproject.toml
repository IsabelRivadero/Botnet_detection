[project]
name = "botfarm"
version = "0.1.0"
description = "Detección de granjas de bots: Louvain + IF/LOF por cuadrantes espacial 2D + ráfagas Poisson Point-in-Time"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "pandas>=2.0",
    "networkx>=2.8",
    "scikit-learn>=1.2",
    "scipy>=1.8",
    "joblib>=1.2",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2"]
dev = ["pytest>=7.0", "black", "ruff"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]